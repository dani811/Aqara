name: Publish to PyPI

# Trusted Publishing (PyPI OIDC) — no API token stored. Requires a pending
# publisher registered on PyPI for: project aqara-u200-ble, owner dani811,
# repo Aqara, workflow publish.yml, environment pypi (issue #5).
#
# Triggers: automatically when a GitHub Release is published, or manually
# (workflow_dispatch) to (re)publish a specific tag once the PyPI publisher exists.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (e.g. v0.9.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing (this job only)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
