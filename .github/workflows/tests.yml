name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,ble]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy aqara_u200_ble
      - name: Secret-hygiene guard + unit tests
        run: pytest -q
